<svg width="256" height="256" viewBox="0 0 256 256" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="lumineerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbit -->
  <circle cx="128" cy="128" r="92"
          stroke="url(#lumineerGradient)"
          stroke-width="3"
          opacity="0.5"/>

  <!-- Inner Orbit -->
  <circle cx="128" cy="128" r="64"
          stroke="url(#lumineerGradient)"
          stroke-width="2"
          opacity="0.35"/>

  <!-- Central Star -->
  <path d="
    M128 86
    L138 118
    L170 128
    L138 138
    L128 170
    L118 138
    L86 128
    L118 118
    Z"
    fill="url(#coreGlow)"
    filter="url(#softGlow)"/>

  <!-- Guiding Dot -->
  <circle cx="190" cy="90" r="5" fill="#38BDF8"/>
  <circle cx="70" cy="170" r="4" fill="#F472B6"/>
</svg>
